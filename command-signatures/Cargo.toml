[package]
name = "warp-command-signatures"
version = "0.0.0"
edition = "2021"
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cfg-if = "1.0.0"
clap = { version = "4", features = ["derive"] }
itertools = "0.10.0"
lazy_static = "1.4.0"
log = "0.4"
rayon = { version = "1.5.3", optional = true }
regex = "1.5.4"
rust-embed = { version = "6.4.2", features = ["debug-embed", "include-exclude"], optional = true }
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
serde_with = "^3.21"
warp-completion-metadata = {path = "../completion-metadata"}

[dev-dependencies]
tempfile = "3"

[features]
default = ["embed-signatures"]
embed-signatures = ["rayon", "rust-embed"]

[[bin]]
name = "command-signatures"
path = "src/bin/command-signatures.rs"
required-features = ["embed-signatures"]
